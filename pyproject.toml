[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "durable-agent-state-machine"
version = "0.1.0"
description = "A small durable-execution runtime for agent workflows: SQLite event journal, checkpoints, leases, retries, human approval gates and an outbox."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["durable-execution", "workflow", "state-machine", "agents", "sqlite", "event-sourcing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
bench = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "matplotlib>=3.8",
]

[project.scripts]
durable-agent = "durable_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:asyncio"
markers = [
    "chaos: spawns worker subprocesses and kills them (a few seconds)",
]

[tool.mypy]
python_version = "3.10"
files = ["src/durable_agent"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
